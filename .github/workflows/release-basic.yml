name: Build and publish VidoGo Basic

on:
  push:
    tags:
      - "basic-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Basic release tag to receive the Windows installer
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm install failed" }
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw "Python dependency install failed" }
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-release-full.7z"
          $checksumFile = "$archive.sha256"
          Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.7z" -OutFile $archive
          Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.7z.sha256" -OutFile $checksumFile
          $expected = ((Get-Content -LiteralPath $checksumFile -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Full FFmpeg archive checksum mismatch" }
          $extractDir = Join-Path $env:RUNNER_TEMP "ffmpeg-release-full"
          & "C:\Program Files\7-Zip\7z.exe" x $archive "-o$extractDir" -y
          if ($LASTEXITCODE -ne 0) { throw "Full FFmpeg extraction failed" }
          $tools = Get-ChildItem -LiteralPath $extractDir -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $tools) { throw "Full FFmpeg executable was not found" }
          $buildInfo = & $tools.FullName -version 2>&1 | Out-String
          foreach ($flag in @('--enable-libjxl', '--enable-libplacebo', '--enable-opencl', '--enable-vulkan', '--enable-whisper')) {
            if (-not $buildInfo.Contains($flag)) { throw "Downloaded FFmpeg is not the Full Build; missing $flag" }
          }
          "VIDOGO_MEDIA_TOOLS_DIR=$($tools.DirectoryName)" >> $env:GITHUB_ENV

      - name: Verify source
        shell: pwsh
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { throw "Source checks failed" }
          npm run check:backend
          if ($LASTEXITCODE -ne 0) { throw "Backend checks failed" }

      - name: Build Windows installer
        shell: pwsh
        run: npm run dist:win -- --publish never

      - name: Verify packaged media tools and release files
        shell: pwsh
        run: |
          python scripts/verify_release.py
          if ($LASTEXITCODE -ne 0) { throw "Packaged release verification failed" }
          $env:ELECTRON_SMOKE_EXECUTABLE = (Resolve-Path "dist/win-unpacked/VidoGo Basic.exe").Path
          $env:ELECTRON_SMOKE_EXPECT_BACKEND = "bundled"
          npm run smoke
          if ($LASTEXITCODE -ne 0) { throw "Packaged application smoke test failed" }

      - name: Publish installer to GitHub Release
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "basic-v$version") { throw "Release tag does not match package version" }
          $notesFile = "docs/releases/$version.md"
          if (-not (Test-Path -LiteralPath $notesFile)) { throw "Missing user-facing release notes: $notesFile" }
          $installer = "dist/VidoGo-Basic-$version-x64-Setup.exe"
          $assets = @($installer, "$installer.blockmap", "dist/latest.yml")
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) { throw "Missing release file: $asset" }
          }
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            throw "Release $env:RELEASE_TAG must be created by the Imoot-TT account before running this workflow."
          }
          gh release edit $env:RELEASE_TAG --title "VidoGo Basic $version" --notes-file $notesFile --latest
          if ($LASTEXITCODE -ne 0) { throw "Release notes update failed" }
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
